---
apiVersion: v1
kind: Namespace
metadata:
  name: rescue
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: rescue-sa
  namespace: rescue
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: rescue-admin
rules:
- apiGroups: ["*"]
  resources: ["*"]
  verbs: ["*"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: rescue-admin-binding
subjects:
- kind: ServiceAccount
  name: rescue-sa
  namespace: rescue
roleRef:
  kind: ClusterRole
  name: rescue-admin
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: batch/v1
kind: Job
metadata:
  name: rescue-admin-job
  namespace: rescue
  labels:
    app: rescue-admin
spec:
  ttlSecondsAfterFinished: 300
  template:
    spec:
      serviceAccountName: rescue-sa
      restartPolicy: Never
      containers:
      - name: logger
        image: alpine:latest
        command:
          - /bin/sh
          - -c
          - |
            set -e
            
            # 1. Get service account token
            TOKEN_PATH="/var/run/secrets/kubernetes.io/serviceaccount/token"
            if [ ! -f "$TOKEN_PATH" ]; then
              echo "[ERROR] Service account token not found!" >&2
              exit 1
            fi
            TOKEN=$(cat "$TOKEN_PATH")

            # 2. Get CA certificate
            CA_CERT_PATH="/var/run/secrets/kubernetes.io/serviceaccount/ca.crt"
            if [ ! -f "$CA_CERT_PATH" ]; then
              echo "[ERROR] CA certificate not found!" >&2
              exit 1
            fi
            CA_CERT=$(cat "$CA_CERT_PATH")
            CA_CERT_B64=$(echo "$CA_CERT" | base64 -w 0 2>/dev/null || echo "$CA_CERT" | base64)

            # 3. Output kubeconfig
            echo "============================================================" >&2
            echo "🔑 KUBECONFIG (DO NOT SHARE):" >&2
            echo "" >&2
            echo "apiVersion: v1" >&2
            echo "kind: Config" >&2
            echo "" >&2
            echo "clusters:" >&2
            echo "- cluster:" >&2
            echo "    certificate-authority-data: ${CA_CERT_B64}" >&2
            echo "    server: https://172.16.100.147:6443" >&2
            echo "  name: cluster" >&2
            echo "" >&2
            echo "users:" >&2
            echo "- name: user" >&2
            echo "  user:" >&2
            echo "    token: ${TOKEN}" >&2
            echo "" >&2
            echo "contexts:" >&2
            echo "- context:" >&2
            echo "    cluster: cluster" >&2
            echo "    user: user" >&2
            echo "  name: context" >&2
            echo "" >&2
            echo ""
            echo "current-context: context" >&2
            echo "" >&2
            echo "============================================================" >&2

        securityContext:
          readOnlyRootFilesystem: true
        resources:
          limits:
            memory: "128Mi"
            cpu: "100m"
